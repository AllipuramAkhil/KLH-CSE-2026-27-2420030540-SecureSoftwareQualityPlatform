spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
logging.level.com.assqp.platform=INFO
logging.level.org.springframework.security=WARN

# Security fix: no fallback (compare to the dev default in application.properties). Startup
# fails with an unresolved placeholder error if WEBHOOK_SECRET isn't set in the environment.
jwt.secret=${JWT_SECRET}
webhook.secret=${WEBHOOK_SECRET}
