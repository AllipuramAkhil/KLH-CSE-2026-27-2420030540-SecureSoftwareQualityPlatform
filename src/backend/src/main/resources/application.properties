spring.application.name=assqp-backend
server.port=${SERVER_PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/assqp_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-value-in-production-min-256-bits}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Security fix: the CI/CD webhook was previously completely unauthenticated - anyone who
# knew a project id could POST to it and trigger quality/security/risk analysis. Now
# requests must include a valid HMAC-SHA256 signature of the raw body, computed with this
# secret, in the X-Hub-Signature-256 header (GitHub-style: "sha256=<hex>"). See
# WebhookSignatureFilter. No fallback is set for the prod profile (application-prod.properties) -
# startup fails there if WEBHOOK_SECRET isn't provided.
webhook.secret=${WEBHOOK_SECRET:dev-only-webhook-secret-change-in-production}

ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:}
ai.api.model=${AI_API_MODEL:claude-sonnet-4-6}

storage.upload-dir=${UPLOAD_DIR:./uploads}

# Path to the JaCoCo XML coverage report this backend's own Maven build
# produces (see backend/pom.xml jacoco-maven-plugin, and CoverageService).
# Only used by POST /api/projects/{id}/coverage/import (the no-file
# variant); CI can instead push a report directly via /import-file.
coverage.jacoco.report-path=${JACOCO_REPORT_PATH:./target/site/jacoco/jacoco.xml}

# --- SonarQube (Phase 4) ---
# All optional: when SONAR_HOST_URL or SONAR_TOKEN is unset, SonarQubeClient.isAvailable()
# returns false and SonarQube endpoints return a 503 with a clear message - the
# RuleBasedQualityAnalyzer is completely unaffected and keeps working either way.
sonar.host.url=${SONAR_HOST_URL:}
sonar.token=${SONAR_TOKEN:}
sonar.project.key=${SONAR_PROJECT_KEY:}

# --- Trivy (Phase 5) ---
# CLI-trigger mode (optional): only works if the `trivy` binary is present
# in this backend's runtime environment/PATH. File-import mode always
# works regardless - it's how the GitHub Actions pipeline's trivy-fs JSON
# artifact gets into the platform without needing a shared filesystem.
trivy.binary-path=${TRIVY_BINARY_PATH:trivy}
trivy.scan.default-target=${TRIVY_SCAN_TARGET:.}
trivy.scan.timeout-seconds=${TRIVY_SCAN_TIMEOUT_SECONDS:180}
# Security fix (audit issue #8): both the default target above and any targetPath sent by a
# caller are now resolved relative to, and required to stay inside, this workspace root -
# arbitrary server paths can no longer be scanned. See TrivyClientImpl.resolveWithinAllowedRoot.
trivy.scan.allowed-root=${TRIVY_SCAN_ALLOWED_ROOT:./uploads}

# --- OWASP ZAP (Phase 6) ---
# Live scanning is optional and safety-gated: requires ZAP_API_URL to be
# configured AND the requested targetUrl to match one of ZAP_ALLOWED_TARGETS
# (comma-separated allow-list) - arbitrary external URLs can never be
# scanned, this is enforced before any request reaches ZAP. When
# ZAP_ALLOWED_TARGETS is empty, no live scan is permitted at all.
# Import-file mode (uploading a ZAP JSON report) always works regardless.
zap.api.url=${ZAP_API_URL:}
zap.api.key=${ZAP_API_KEY:}
zap.allowed-targets=${ZAP_ALLOWED_TARGETS:}
zap.scan.timeout-seconds=${ZAP_SCAN_TIMEOUT_SECONDS:120}

# --- ML Risk Prediction Service (Phase 8) ---
# Optional: when ML_SERVICE_URL is unset, RiskAssessmentServiceImpl uses
# the rule-based risk engine only (predictionMethod=RULE_BASED) - exactly
# the pre-Phase-8 behavior. When set, each component's risk is also sent
# to the ML service and combined into a HYBRID result (see
# risk.HybridRiskCalculator). A single retry covers transient network
# blips; anything else falls back to rule-based for that component.
ml.service.url=${ML_SERVICE_URL:}
ml.service.timeout-seconds=${ML_SERVICE_TIMEOUT_SECONDS:10}
ml.service.retrain-timeout-seconds=${ML_SERVICE_RETRAIN_TIMEOUT_SECONDS:60}
# Must match ML_INTERNAL_SECRET on the ml-service side (see MlPredictionClientImpl, main.py).
ml.service.internal-secret=${ML_INTERNAL_SECRET:}

# --- Git Code Churn (Phase 9) ---
# Reads LOCAL git history only (JGit) - no GitHub API needed. Defaults to
# '.' (this backend's own working directory/checkout). Point it at any
# readable git repo's root via GIT_REPO_PATH. If the path isn't a git
# repo, /api/code-churn/status reports gitAvailable=false and analysis
# endpoints return empty results rather than erroring.
git.churn.repo-path=${GIT_REPO_PATH:.}
git.churn.lookback-days=${GIT_CHURN_LOOKBACK_DAYS:90}
git.churn.max-commits=${GIT_CHURN_MAX_COMMITS:500}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.com.assqp.platform=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
